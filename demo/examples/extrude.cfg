function: ocularExtrudeFilter
use_stride: true
params:
    type: 0 # 0 blocks, 1 pyramids
    size: 30 # cell size in pixels [2 - 255]
    depth: 30 # extrusion depth [1 - 255]
    depth_mode: 0 # 0 random heights, 1 level based (heights follow cell brightness)
    solid_front: false # true = flat-color block fronts (blocks only)
    mask_incomplete: false # true = leave cells cut off by the image edge unmodified
    seed: 0 # random seed for random heights
