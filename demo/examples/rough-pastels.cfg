function: ocularRoughPastelsFilter
use_stride: true
params:
    stroke_length: 6 # [0 - 40], 0 disables strokes
    stroke_detail: 4 # [1 - 20]
    texture: 2 # 0 brick, 1 burlap, 2 canvas, 3 sandstone
    scaling: 100 # percent [50 - 200]
    relief: 20 # [0 - 50], 0 disables texture
    light: 0 # 0 top, 1 top right, 2 right, 3 bottom right, 4 bottom, 5 bottom left, 6 left, 7 top left
    invert: false # invert texture relief
