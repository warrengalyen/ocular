function: ocularColoredPencilFilter
use_stride: true
params:
    pencil_width: 4 # stroke width [1 - 24]
    stroke_pressure: 8 # [0 - 15]
    paper_brightness: 25 # [0 - 50]
    foreground_r: 0 # foreground (pencil) color [0 - 255]
    foreground_g: 0
    foreground_b: 0
    background_r: 255 # background (paper) color [0 - 255]
    background_g: 255
    background_b: 255
